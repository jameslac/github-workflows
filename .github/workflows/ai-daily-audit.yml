name: AI Daily Repo Audit

on:
  workflow_call:
    inputs:
      model:
        description: "Optional AI model override (defaults to vars.AI_REVIEW_MODEL or provider default)"
        required: false
        type: string
      central_ref:
        description: "Git ref of jameslac/github-workflows to fetch the audit script from"
        required: false
        type: string
        default: "main"
      label:
        description: "Label applied to filed issues (used by downstream automation to pick them up)"
        required: false
        type: string
        default: "ai-audit"
      max_issues:
        description: "Max issues to file per run"
        required: false
        type: number
        default: 5
      force:
        description: "Skip the already-audited-HEAD check"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Daily Repo Audit -> Issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Google GenAI SDK
        run: pip install -U google-genai

      - name: Fetch central audit script
        env:
          CENTRAL_REF: ${{ inputs.central_ref }}
        run: |
          rm -rf /tmp/github-workflows
          git clone --depth 1 --branch "$CENTRAL_REF" https://github.com/jameslac/github-workflows.git /tmp/github-workflows

      - name: Run daily AI audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_REVIEW_MODEL: ${{ inputs.model || vars.AI_REVIEW_MODEL }}
          AUDIT_LABEL: ${{ inputs.label }}
          AUDIT_MAX_ISSUES: ${{ inputs.max_issues }}
          AUDIT_FORCE: ${{ inputs.force && '1' || '' }}
        run: python3 /tmp/github-workflows/scripts/ai_repo_audit.py
